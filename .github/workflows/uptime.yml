name: Uptime Checks

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  uptime:
    name: Production uptime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public endpoints
        run: |
          set -euo pipefail

          urls=(
            "https://docnow.in"
            "https://api.docnow.in/health/live"
            "https://api.docnow.in/health/ready"
          )

          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --fail --show-error --silent --location --max-time 20 "${url}" >/dev/null
          done
